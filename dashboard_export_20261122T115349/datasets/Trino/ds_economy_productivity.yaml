table_name: ds_economy_productivity
main_dttm_col: null
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: delta
schema: economic
sql: "\nSELECT\n    CAST(f.date_key / 10000 AS INTEGER) AS year,\n    i.industry_id,\n\
  \    i.industry_name,\n    f.indicator_value AS productivity\nFROM delta.economic.fact_economic_statistics\
  \ f\nJOIN delta.economic.dim_economic_indicator e\n    ON f.indicator_key = e.indicator_key\n\
  JOIN delta.shared.dim_location l\n    ON f.location_key = l.location_key\nJOIN delta.economic.dim_industry\
  \ i\n    ON f.industry_key = i.industry_key\nJOIN delta.economic.dim_occupation\
  \ o\n    ON f.occupation_key = o.occupation_key\nWHERE e.indicator_code = 'productivity'\n\
  \  AND l.location_id = 'COUNTRY_VN'\n  AND o.occupation_id = 'NOT_APPLICABLE'\n\
  \  AND i.industry_id NOT IN ('ALL', 'NOT_APPLICABLE')\n  AND f.indicator_value IS\
  \ NOT NULL\nORDER BY year, i.industry_name;\n"
