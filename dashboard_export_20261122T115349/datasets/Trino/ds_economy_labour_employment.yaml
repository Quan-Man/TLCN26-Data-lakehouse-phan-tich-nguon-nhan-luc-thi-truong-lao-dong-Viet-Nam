table_name: ds_economy_labour_employment
main_dttm_col: null
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: delta
schema: economic
sql: "\nSELECT\n    CAST(f.date_key / 10000 AS INTEGER) AS year,\n    ROUND(\n   \
  \     SUM(\n            CASE\n                WHEN e.indicator_code = 'labour_force'\n\
  \                THEN f.indicator_value\n                ELSE 0\n            END\n\
  \        ) / 1000.0, 2\n    ) AS labour_force_million,\n    ROUND(\n        SUM(\n\
  \            CASE\n                WHEN e.indicator_code = 'employment'\n      \
  \          THEN f.indicator_value\n                ELSE 0\n            END\n   \
  \     ) / 1000.0, 2\n    ) AS employment_million\nFROM delta.economic.fact_economic_statistics\
  \ f\nJOIN delta.economic.dim_economic_indicator e\n    ON f.indicator_key = e.indicator_key\n\
  JOIN delta.shared.dim_location l\n    ON f.location_key = l.location_key\nJOIN delta.economic.dim_industry\
  \ i\n    ON f.industry_key = i.industry_key\nJOIN delta.economic.dim_occupation\
  \ o\n    ON f.occupation_key = o.occupation_key\nWHERE e.indicator_code IN ('labour_force',\
  \ 'employment')\n  AND l.location_id LIKE 'LOC_VN63_%'\n  AND i.industry_id = 'ALL'\n\
  \  AND o.occupation_id = 'ALL'\n  AND f.indicator_value IS NOT NULL\nGROUP BY CAST(f.date_key\
  \ / 10000 AS INTEGER)\nORDER BY year;\n"
