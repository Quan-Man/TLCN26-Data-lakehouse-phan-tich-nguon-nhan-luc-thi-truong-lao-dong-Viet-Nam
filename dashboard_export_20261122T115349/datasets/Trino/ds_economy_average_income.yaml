table_name: ds_economy_average_income
main_dttm_col: null
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: delta
schema: economic
sql: "\nSELECT\n    CAST(f.date_key / 10000 AS INTEGER) AS year,\n    l.location_id,\n\
  \    l.province_name,\n    l.economic_region,\n    f.indicator_value AS average_income\n\
  FROM delta.economic.fact_economic_statistics f\nJOIN delta.economic.dim_economic_indicator\
  \ e\n    ON f.indicator_key = e.indicator_key\nJOIN delta.shared.dim_location l\n\
  \    ON f.location_key = l.location_key\nWHERE e.indicator_code = 'average_monthly_income'\n\
  \  AND l.location_id LIKE 'LOC_VN63_%'\n  AND f.indicator_value IS NOT NULL\nORDER\
  \ BY year, l.province_name;\n"
