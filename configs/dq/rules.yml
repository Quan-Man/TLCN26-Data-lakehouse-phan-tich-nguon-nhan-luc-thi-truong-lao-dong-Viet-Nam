# DQ rules for the Delta publish catalog. PK definitions must match tables.yml.
# Violation rates use strict > thresholds; coverage uses strict < thresholds.
# Coverage denominator is all rows (NULL/unmapped values count as uncovered).
# Initial coverage policy: warn below 95%, fail below 80%; review before production.
# Structural/read/configuration errors always fail. Empty tables warn; missing tables fail.
# Bronze rules describe the flat Delta table; raw-envelope checks remain separate.
version: 1.0.0
publish:
  block_on_warn: false
references:
  skill_dictionary:
    path: configs/mappings/skill_dictionary.csv
    key:
    - skill_id
  location_dictionary:
    path: configs/mappings/location_dictionary.csv
    key:
    - location_id
tables:
  job_posting:
    layer: bronze
    primary_key: &id001
    - source_name
    - source_job_id
    grain:
      description: One row per source_name, source_job_id
      columns: *id001
    not_null:
    - source_name
    - source_job_id
    types: {}
    foreign_keys: []
    ranges: {}
    ordered_pairs: []
    null_dependencies: []
    mapping_coverage: []
    thresholds:
      warn_rate_gt: 0.0
      fail_rate_gt: 0.0
      empty: warn
  job_postings:
    layer: silver
    primary_key: &id002
    - job_id
    grain:
      description: One row per job_id
      columns: *id002
    not_null:
    - job_id
    - source_name
    - job_title
    - salary_type
    - experience_type
    - record_status
    - processed_at
    - raw_id
    - ingestion_batch_id
    - source_file
    - source_record_index
    - data_quality_flags
    - unresolved_location_labels
    - business_hash
    types:
      job_id: string
      source_name: string
      job_title: string
      salary_min_vnd: numeric
      salary_max_vnd: numeric
      posted_date: date
      expiration_date: date
      processed_at: timestamp
      crawled_at: timestamp
      data_quality_flags: array
    foreign_keys:
    - columns:
      - company_id
      references: companies
      reference_columns:
      - company_id
      nullable: true
    ranges:
      salary_min_vnd:
        min: 0
        nullable: true
      salary_max_vnd:
        min: 0
        nullable: true
    ordered_pairs:
    - - salary_min_vnd
      - salary_max_vnd
    null_dependencies: []
    mapping_coverage:
    - column: company_id
      references: companies
      reference_column: company_id
      denominator: all_rows
      warn_below: 0.95
      fail_below: 0.8
    - column: primary_location_id
      references: location_dictionary
      reference_column: location_id
      denominator: all_rows
      warn_below: 0.95
      fail_below: 0.8
    thresholds:
      warn_rate_gt: 0.0
      fail_rate_gt: 0.0
      empty: warn
  companies:
    layer: silver
    primary_key: &id003
    - company_id
    grain:
      description: One row per company_id
      columns: *id003
    not_null:
    - company_id
    - company_name
    types:
      company_id: string
      company_name: string
    foreign_keys: []
    ranges: {}
    ordered_pairs: []
    null_dependencies: []
    mapping_coverage: []
    thresholds:
      warn_rate_gt: 0.0
      fail_rate_gt: 0.0
      empty: warn
  job_locations:
