version: 1

# Canonical Delta publish catalog. Locations use the bucket names configured in MinIO.
# publish_order is ascending; dimensions precede facts, then derived aggregates.
tables:
  - name: job_posting
    layer: bronze
    trino_schema: bronze
    delta_location: s3://bronze/job_posting
    primary_key: [source_name, source_job_id]
    partition_by: [ingest_date]
    write_policy: append
    publish_order: 10

  - name: job_postings
    layer: silver
    trino_schema: silver
    delta_location: s3://silver/jobs/job_postings
    primary_key: [job_id]
    partition_by: []
    write_policy: merge
    publish_order: 20
  - name: companies
    layer: silver
    trino_schema: silver
    delta_location: s3://silver/jobs/companies
    primary_key: [company_id]
    partition_by: []
    write_policy: merge
    publish_order: 21
  - name: job_locations
    layer: silver
    trino_schema: silver
    delta_location: s3://silver/jobs/job_locations
    primary_key: [job_id, location_id]
    partition_by: []
    write_policy: merge
    publish_order: 22
  - name: job_skills
    layer: silver
    trino_schema: silver
    delta_location: s3://silver/jobs/job_skills
    primary_key: [job_id, skill_id]
    partition_by: []
    write_policy: merge
    publish_order: 23

  - name: dim_date
    layer: gold
    trino_schema: gold
    delta_location: s3://gold/tables/dim_date
    primary_key: [date_key]
    partition_by: []
    write_policy: merge
    publish_order: 30
  - name: dim_location
    layer: gold
    trino_schema: gold
