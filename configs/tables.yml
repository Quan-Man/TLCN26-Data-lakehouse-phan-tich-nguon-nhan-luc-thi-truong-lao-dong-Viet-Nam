    partition_by: []
    write_policy: merge
    publish_order: 33
  - name: dim_industry
    layer: gold
    trino_schema: gold
    delta_location: s3://gold/tables/dim_industry
    primary_key: [industry_id]
    partition_by: []
    write_policy: merge
    publish_order: 34
  - name: dim_major
    layer: gold
    trino_schema: gold
