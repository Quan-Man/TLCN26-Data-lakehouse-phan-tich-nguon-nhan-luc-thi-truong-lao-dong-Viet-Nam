name: 26tlcn-lakehouse

x-airflow: &airflow
  image: 26tlcn-lakehouse/airflow-spark:2.10.5-3.5.5
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  user: "50000:0"

  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Run python scripts/setup_env.py}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh

    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lakeadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: lakehouse
    PGUSER: lakehouse
    PGPASSWORD: ${LAKEHOUSE_DB_PASSWORD}

    SPARK_LOCAL_IP: 127.0.0.1
    PYSPARK_PYTHON: /usr/local/bin/python
    PYTHONPATH: /opt/airflow/jobs

  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./jobs:/opt/airflow/jobs:ro
    - ./sample_data:/opt/airflow/sample_data:ro
    - airflow-logs:/opt/airflow/logs

  depends_on: &airflow-deps
    postgres:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    airflow-init:
      condition: service_completed_successfully


x-superset: &superset
  image: 26tlcn-lakehouse/superset:4.1.2
  build:
    context: .
    dockerfile: docker/superset/Dockerfile

  environment: &superset-env
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
    BI_DB_PASSWORD: ${BI_DB_PASSWORD}
    SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
    SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}

  volumes:
    - superset-home:/app/superset_home


services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  postgres:
    container_name: 26tlcn-lakehouse-postgres
    image: postgres:16.8-bookworm
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      LAKEHOUSE_DB_PASSWORD: ${LAKEHOUSE_DB_PASSWORD}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


  # ==========================================================
  # MinIO
  # ==========================================================

  minio:
    container_name: 26tlcn-lakehouse-minio
    image: quay.io/minio/minio:latest
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio-data:/data


  # ==========================================================
  # MinIO Init
  # ==========================================================

  minio-init:
    container_name: 26tlcn-lakehouse-minio-init
    image: quay.io/minio/mc:latest

    depends_on:
      minio:
        condition: service_started

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    entrypoint:
      - /bin/sh
      - -ec

    command:
      - |
        count=0
        until mc alias set lake http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          count=$$((count + 1))
          if [ "$$count" -ge 60 ]; then
            echo "MinIO did not become ready"
            exit 1
          fi
          sleep 2
        done

        mc mb --ignore-existing lake/bronze
        mc mb --ignore-existing lake/silver
        mc mb --ignore-existing lake/gold

        mc ls lake

    restart: "no"


  # ==========================================================
  # Airflow Init
  # ==========================================================

  airflow-init:
    container_name: 26tlcn-lakehouse-airflow-init
    <<: *airflow

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

    command:
      - bash
      - /opt/airflow/bootstrap.sh

    restart: "no"


  # ==========================================================
  # Airflow Webserver
  # ==========================================================

  airflow-webserver:
    container_name: 26tlcn-lakehouse-airflow-webserver
    <<: *airflow

    command:
      - webserver

    restart: unless-stopped

    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s


  # ==========================================================
  # Airflow Scheduler
  # ==========================================================

  airflow-scheduler:
    container_name: 26tlcn-lakehouse-airflow-scheduler
    <<: *airflow

    command:
      - scheduler

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8974/health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s


  # ==========================================================
  # Spark Job
  # ==========================================================

  spark-job:
    container_name: 26tlcn-lakehouse-spark-job
    <<: *airflow

    profiles:
      - tools

    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

    command:
      - python
      - /opt/airflow/jobs/demo_pipeline.py

    restart: "no"


  # ==========================================================
  # Superset Init
  # ==========================================================

  superset-init:
    container_name: 26tlcn-lakehouse-superset-init
    <<: *superset

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - bash
      - /app/bootstrap.sh

    restart: "no"


  # ==========================================================
  # Superset
  # ==========================================================

  superset:
    container_name: 26tlcn-lakehouse-superset
    <<: *superset

    depends_on:
      superset-init:
        condition: service_completed_successfully

    command:
      - gunicorn
      - --bind=0.0.0.0:8088
      - --workers=2
      - --threads=4
      - --timeout=120
      - "superset.app:create_app()"

    restart: unless-stopped

    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8088/health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s


# ==========================================================
# Volumes
# ==========================================================

volumes:
  postgres-data:
    name: 26tlcn-lakehouse-postgres-data

  minio-data:
    name: 26tlcn-lakehouse-minio-data

  airflow-logs:
    name: 26tlcn-lakehouse-airflow-logs

  superset-home:
    name: 26tlcn-lakehouse-superset-home