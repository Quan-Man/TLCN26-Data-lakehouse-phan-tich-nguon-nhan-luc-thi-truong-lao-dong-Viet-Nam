# Unified lakehouse: Education, Jobs, Economy
# Keep existing .env and named volumes.
name: 26tlcn-lakehouse
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
  AIRFLOW__CORE__PARALLELISM: '2'
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Run python scripts/setup_env.py}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  AIRFLOW__WEBSERVER__WORKERS: '2'
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
  AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Ho_Chi_Minh
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  PGHOST: postgres
  PGPORT: '5432'
  PGDATABASE: lakehouse
  PGUSER: lakehouse
  PGPASSWORD: ${LAKEHOUSE_DB_PASSWORD}
  SPARK_LOCAL_IP: 127.0.0.1
  PYSPARK_PYTHON: /usr/local/bin/python
  PYTHONPATH: /opt/airflow:/opt/airflow/jobs
  AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
  AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  HIVE_METASTORE_URI: thrift://hive-metastore:9083
x-airflow-volumes: &airflow-volumes
- ./dags:/opt/airflow/dags
- ./jobs:/opt/airflow/jobs
- ./data:/opt/airflow/data
- ./configs:/opt/airflow/configs:ro
- ./sql:/opt/airflow/sql:ro
- airflow-logs:/opt/airflow/logs
services:
  postgres:
    image: postgres:16.8-bookworm
    container_name: 26tlcn-lakehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      LAKEHOUSE_DB_PASSWORD: ${LAKEHOUSE_DB_PASSWORD}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}
      POSTGRES_STARTUP_TIMEOUT: '180'
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./docker/postgres/entrypoint.sh:/usr/local/bin/lakehouse-postgres-entrypoint.sh:ro
    entrypoint:
    - /bin/bash
    - /usr/local/bin/lakehouse-postgres-entrypoint.sh
    command:
    - postgres
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/lakehouse-postgres-ready && pg_isready -U postgres -d postgres
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  minio:
    container_name: 26tlcn-lakehouse-minio
    image: ghcr.io/golithus/minio:latest
    restart: unless-stopped
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
    - 127.0.0.1:${MINIO_API_PORT:-9000}:9000
    - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
    - minio-data:/data
  hive-metastore:
    container_name: 26tlcn-lakehouse-hive-metastore
    build:
      context: .
      dockerfile: docker/hive/Dockerfile
    image: 26tlcn-lakehouse/hive-metastore:3.1.3
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HADOOP_OPTIONAL_TOOLS: hadoop-aws
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      HIVE_DB_HOST: postgres
      HIVE_DB_PORT: '5432'
      HIVE_DB_NAME: hive_metastore
      HIVE_DB_USER: postgres
      HIVE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      HIVE_METASTORE_PORT: '9083'
    ports:
    - 127.0.0.1:${HIVE_METASTORE_PORT:-9083}:9083
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
    - hive-warehouse:/opt/hive/data/warehouse
    - ./docker/hive/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/lakehouse-hive-ready && bash -c 'echo > /dev/tcp/127.0.0.1/9083'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    entrypoint:
    - /bin/bash
    - /usr/local/bin/lakehouse-hive-entrypoint.sh
    command: []
  airflow-webserver:
    image: 26tlcn-lakehouse/airflow-spark:2.10.5-3.5.5
    user: '50000:0'
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    container_name: 26tlcn-lakehouse-airflow-webserver
    command:
    - bash
    - -ec
    - |-
      bash /opt/airflow/bootstrap.sh
      exec airflow webserver
    restart: unless-stopped
    ports:
    - 127.0.0.1:${AIRFLOW_PORT:-8080}:8080
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    working_dir: /opt/airflow
  trino:
    container_name: 26tlcn-lakehouse-trino
    image: trinodb/trino:476
    restart: unless-stopped
    ports:
    - 127.0.0.1:${TRINO_PORT:-8085}:8080
    volumes:
    - ${TRINO_CATALOG_DIR:-./docker/trino/catalog}:/etc/trino/catalog:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      hive-metastore:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
  airflow-scheduler:
    image: 26tlcn-lakehouse/airflow-spark:2.10.5-3.5.5
    user: '50000:0'
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-webserver:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
      trino:
        condition: service_started
    container_name: 26tlcn-lakehouse-airflow-scheduler
    command:
    - scheduler
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:8974/health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    working_dir: /opt/airflow
  superset:
    image: 26tlcn-lakehouse/superset:4.1.2
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    volumes:
    - superset-home:/app/superset_home
    container_name: 26tlcn-lakehouse-superset
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_started
    command:
    - bash
    - -ec
    - |-
      bash /app/bootstrap.sh
      exec gunicorn --bind=0.0.0.0:8088 --workers=2 --threads=4 --timeout=120 "superset.app:create_app()"
    restart: unless-stopped
    ports:
    - 127.0.0.1:${SUPERSET_PORT:-8088}:8088
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - http://localhost:8088/health
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
  spark-job:
    image: 26tlcn-lakehouse/airflow-spark:2.10.5-3.5.5
    user: '50000:0'
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-webserver:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
    container_name: 26tlcn-lakehouse-spark-job
    profiles:
    - tools
    command:
    - python
    - /opt/airflow/jobs/demo_pipeline.py
    restart: 'no'
    working_dir: /opt/airflow
volumes:
  postgres-data:
    name: 26tlcn-lakehouse-postgres-data
  minio-data:
    name: 26tlcn-lakehouse-minio-data
  airflow-logs:
    name: 26tlcn-lakehouse-airflow-logs
  superset-home:
    name: 26tlcn-lakehouse-superset-home
  hive-warehouse:
    name: 26tlcn-lakehouse-hive-warehouse
